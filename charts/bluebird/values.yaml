nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

replicas: 1

image:
  name: zimmertr/bluebird
  # Empty = chart appVersion. The repo publishes SemVer tags only, no `latest`.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

containerPort: 8000
extraEnv:
  - name: LOG_LEVEL
    value: "WARNING"
  - name: RATE_LIMIT_ANALYZE_PER_MINUTE
    value: "12"
  - name: RATE_LIMIT_ANALYZE_BURST
    value: "6"
  - name: RATE_LIMIT_DESTINATIONS_PER_MINUTE
    value: "30"
  - name: RATE_LIMIT_DESTINATIONS_BURST
    value: "10"
  - name: RATE_LIMIT_GEOCODE_PER_MINUTE
    value: "30"
  - name: RATE_LIMIT_GEOCODE_BURST
    value: "10"
  - name: UPSTREAM_CONCURRENCY_WEATHER
    value: "4"
  - name: UPSTREAM_CONCURRENCY_AQI
    value: "4"
  - name: UPSTREAM_CONCURRENCY_OVERPASS
    value: "2"
  - name: UPSTREAM_WEIGHT_PER_MINUTE_WEATHER
    value: "550"
  - name: UPSTREAM_WEIGHT_PER_MINUTE_AQI
    value: "550"
  - name: UPSTREAM_WEIGHT_MAX_WAIT_S
    value: "120"
  - name: NOMINATIM_MIN_INTERVAL_MS
    value: "3500"
  - name: UPSTREAM_BUDGET_WAIT_S
    value: "30"
  - name: RATE_LIMIT_WILDFIRES_PER_MINUTE
    value: "90"
  - name: RATE_LIMIT_WILDFIRES_BURST
    value: "30"
  - name: WILDFIRE_CACHE_TTL_S
    value: "600"
  - name: WILDFIRE_RETRY_AFTER_FAILURE_S
    value: "60"
  - name: RATE_LIMIT_SMOKE_PER_MINUTE
    value: "90"
  - name: RATE_LIMIT_SMOKE_BURST
    value: "30"
  - name: SMOKE_CACHE_TTL_S
    value: "1800"
  - name: SMOKE_RETRY_AFTER_FAILURE_S
    value: "60"
# Measured against live production on 2026-07-30 with cgroup v2 counters
# (memory.peak and cpu.stat usage_usec, not `kubectl top` -- its decaying ~15s
# average hides exactly the peaks a limit has to cover). Per pod: idle 2m CPU
# / 49Mi; 200 concurrent visitors on the static SPA path (~342 req/s per pod)
# 0.89 cores median, 1.41 peak, 63Mi; discovery load 81Mi peak.
#
# No CPU limit on purpose. CFS throttling on a latency-sensitive async service
# costs tail latency for no benefit when the node has headroom; the request is
# what earns a scheduling guarantee, and the HPA below is what handles load.
#
# The memory REQUEST moved 128Mi -> 256Mi for app 0.44+, which holds a national
# wildfire-perimeter snapshot in memory rather than letting each visitor query
# NIFC for themselves (bluebird#203). Measured 2026-07-31 against the live NIFC
# layer at 232 active fires: 42Mi cold, 184Mi once the snapshot is held, and
# flat across 20 further national viewports. The cost is resident for the
# pod's whole life, not per request, so it belongs in the request rather than
# the headroom under the limit. It is dominated by the full-resolution copy
# (16.5MB of geometry, 861k vertices), kept at full resolution because the
# proximity warning measures distances against it; the map's copy is simplified
# separately. Re-measure if that fidelity choice changes.
#
# The smoke snapshot added in bluebird#121 does not move this. It is one day's
# NOAA HMS analysis held as prebuilt response text: measured 2026-08-04 at
# 32KB for a quiet day and 447KB of source KML for a busy one, three orders of
# magnitude under the perimeter set, so the request stays where the fire
# overlay put it.
#
# The request moved 256Mi -> 512Mi after the 2026-08 readiness review
# (bluebird#259). The review read the running pods with the same cgroup v2
# counters and found 225-253Mi across three healthy replicas at ~1% load --
# about 98% of the 256Mi request, which made this pod the node's first
# eviction candidate under memory pressure. The growing part is the wildfire
# snapshot above, which scales with the national fire count and therefore
# peaks in fire season rather than in any quiet test. 512Mi is roughly twice
# the measured steady state; the review's own recommendation was 384Mi and the
# maintainer chose the larger step for fire-season headroom. Re-measure at the
# next season peak.
#
# The memory limit is the one number here NOT taken from measurement. The
# analyze fallback carries hourly `series` arrays for every row, so a
# 1,500-destination 16-day request is plausibly a few hundred MB, and that
# path was not load-tested. 2Gi is deliberately generous so introducing a
# limit cannot regress a path that runs unbounded today. Re-measure if the
# analyze fan-out or the Open-Meteo weight budgets change.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# Asserts at the pod level what the image already provides: it runs as uid/gid
# 10001 and writes nothing to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem needs no writable volume: the image sets
# PYTHONDONTWRITEBYTECODE=1 and the app has no tempfile use, no file logging
# and no on-disk cache (both caches are in-process). Verified by running the
# released image under `docker run --read-only` through a full analyze.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# When enabled, spec.replicas is omitted from the workload entirely so a
# GitOps controller cannot fight the HPA over it, and minReplicas becomes the
# floor. CPU is the metric because it is the only one available without a
# custom-metrics adapter -- and it is a real signal here, since static SPA
# serving (production's hot path) is CPU-bound. Memory is deliberately absent:
# in-process caches do not shed on scale-out, so it scales up and never back.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior: {}

# minAvailable, not maxUnavailable: PDB percentages round UP, so at 3 replicas
# `maxUnavailable: 50%` allows 2 disruptions and leaves only 1 pod, while
# `minAvailable: 50%` requires 2 to survive. A percentage rather than an
# integer so the budget tracks HPA-driven replica changes.
podDisruptionBudget:
  enabled: false
  minAvailable: 50%
  maxUnavailable: ""

# Upstream spec.topologySpreadConstraints, except labelSelector, which the
# chart injects to match its own pods. maxSkew 1 over hostname spreads one pod
# per node while nodes last and collapses gracefully when they do not: 3 nodes
# gives [1,1,1], 2 gives [2,1] with nothing Pending, 1 gives [3] because only
# one domain exists. Chosen over podAntiAffinity, whose `preferred` form
# permits needless co-location and whose `required` form leaves pods Pending
# rather than falling back. No matchLabelKeys: Argo Rollouts labels pods
# `rollouts-pod-template-hash`, and per-revision spread is what creates canary
# scheduling deadlocks.
topologySpreadConstraints: []

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  startup:
    enabled: true
    httpGet:
      path: /healthz
      port: 8000
    failureThreshold: 30
    periodSeconds: 5

# Render an Argo Rollout instead of a Deployment. The strategy below must then
# be Canary or BlueGreen.
useRollout: false

# Deployment and Rollout. Unset uses the API default of 600s.
progressDeadlineSeconds:
# Rollout only. Exceeding the deadline otherwise marks it Degraded but never
# rolls back.
progressDeadlineAbort: false

# RollingUpdate | Recreate -> Deployment. Canary | BlueGreen -> Argo Rollout.
# The matching block below (if any) becomes the workload's spec.strategy
# verbatim. An optional `rollingUpdate` map is honored the same way
# (maxSurge/maxUnavailable); unset, the API defaults apply.
strategy: RollingUpdate

# Rollout spec.strategy.canary, verbatim (tpl-rendered so the defaults track
# the release name). Anything env-specific — trafficRouting, analysis,
# experiments — is opt-in; see the README for an Istio example.
canary:
  stableService: '{{ include "bluebird.fullname" . }}'
  canaryService: '{{ include "bluebird.fullname" . }}-canary'
  stableMetadata:
    labels:
      role: stable
  canaryMetadata:
    labels:
      role: canary
  steps:
    - setWeight: 33
    - setWeight: 66
    - setWeight: 100

# Rollout spec.strategy.blueGreen, verbatim (tpl-rendered).
blueGreen:
  activeService: '{{ include "bluebird.fullname" . }}'
  previewService: '{{ include "bluebird.fullname" . }}-canary'

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  gatewaySelector:
    istio: gateway
  hosts:
    - chart-example.local
  port: 80
  httpsRedirect: false
  tls:
    enabled: false
    credentialName: ""
  mesh: true

experiment:
  enabled: false
  host: ""
