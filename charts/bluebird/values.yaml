nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

replicas: 1

image:
  name: zimmertr/bluebird
  # Empty = chart appVersion. The repo publishes SemVer tags only, no `latest`.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

containerPort: 8000
extraEnv: []
resources: {}
podSecurityContext: {}
securityContext: {}

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  startup:
    enabled: true
    httpGet:
      path: /healthz
      port: 8000
    failureThreshold: 30
    periodSeconds: 5

# Usually leave this empty: supplying a `canary` or `blueGreen` block below
# selects that strategy, and neither means RollingUpdate. Set it explicitly to
# force one (RollingUpdate | Recreate -> Deployment, Canary | BlueGreen -> Argo
# Rollout). An optional `rollingUpdate` map is honored the same way
# (maxSurge/maxUnavailable); unset, the API defaults apply.
strategy: ""

# Deployment and Rollout. Unset uses the API default of 600s.
progressDeadlineSeconds:
# Rollout only. Without it, exceeding the deadline marks the Rollout Degraded
# but never rolls back.
progressDeadlineAbort: false

# Rollout spec.strategy.canary, verbatim (tpl-rendered). Supplying it selects
# the Canary strategy. stableService, canaryService, stableMetadata and
# canaryMetadata are filled in for you; anything env-specific (trafficRouting,
# analysis, experiments) is opt-in. See the README for an Istio example.
#
# canary:
#   steps:
#     - setWeight: 33
#     - setWeight: 66
#     - setWeight: 100

# Rollout spec.strategy.blueGreen, verbatim (tpl-rendered). Supplying it selects
# the BlueGreen strategy; activeService and previewService are filled in.
#
# blueGreen:
#   autoPromotionEnabled: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  gatewaySelector:
    istio: gateway
  hosts:
    - chart-example.local
  port: 80
  httpsRedirect: false
  tls:
    enabled: false
    credentialName: ""
  mesh: true

experiment:
  enabled: false
  host: ""
