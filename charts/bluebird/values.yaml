nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

replicas: 1

image:
  name: zimmertr/bluebird
  # Empty = chart appVersion. The repo publishes SemVer tags only, no `latest`.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

containerPort: 8000
extraEnv:
  - name: LOG_LEVEL
    value: "WARNING"
  - name: RATE_LIMIT_ANALYZE_PER_MINUTE
    value: "12"
  - name: RATE_LIMIT_ANALYZE_BURST
    value: "6"
  - name: RATE_LIMIT_DESTINATIONS_PER_MINUTE
    value: "30"
  - name: RATE_LIMIT_DESTINATIONS_BURST
    value: "10"
  - name: RATE_LIMIT_GEOCODE_PER_MINUTE
    value: "30"
  - name: RATE_LIMIT_GEOCODE_BURST
    value: "10"
  - name: UPSTREAM_CONCURRENCY_WEATHER
    value: "4"
  - name: UPSTREAM_CONCURRENCY_AQI
    value: "4"
  - name: UPSTREAM_CONCURRENCY_OVERPASS
    value: "2"
  - name: UPSTREAM_WEIGHT_PER_MINUTE_WEATHER
    value: "180"
  - name: UPSTREAM_WEIGHT_PER_MINUTE_AQI
    value: "180"
  - name: UPSTREAM_WEIGHT_MAX_WAIT_S
    value: "120"
  - name: NOMINATIM_MIN_INTERVAL_MS
    value: "3500"
  - name: UPSTREAM_BUDGET_WAIT_S
    value: "30"
resources: {}
podSecurityContext: {}
securityContext: {}

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  startup:
    enabled: true
    httpGet:
      path: /healthz
      port: 8000
    failureThreshold: 30
    periodSeconds: 5

# Render an Argo Rollout instead of a Deployment. The strategy below must then
# be Canary or BlueGreen.
useRollout: false

# Deployment and Rollout. Unset uses the API default of 600s.
progressDeadlineSeconds:
# Rollout only. Exceeding the deadline otherwise marks it Degraded but never
# rolls back.
progressDeadlineAbort: false

# RollingUpdate | Recreate -> Deployment. Canary | BlueGreen -> Argo Rollout.
# The matching block below (if any) becomes the workload's spec.strategy
# verbatim. An optional `rollingUpdate` map is honored the same way
# (maxSurge/maxUnavailable); unset, the API defaults apply.
strategy: RollingUpdate

# Rollout spec.strategy.canary, verbatim (tpl-rendered so the defaults track
# the release name). Anything env-specific — trafficRouting, analysis,
# experiments — is opt-in; see the README for an Istio example.
canary:
  stableService: '{{ include "bluebird.fullname" . }}'
  canaryService: '{{ include "bluebird.fullname" . }}-canary'
  stableMetadata:
    labels:
      role: stable
  canaryMetadata:
    labels:
      role: canary
  steps:
    - setWeight: 33
    - setWeight: 66
    - setWeight: 100

# Rollout spec.strategy.blueGreen, verbatim (tpl-rendered).
blueGreen:
  activeService: '{{ include "bluebird.fullname" . }}'
  previewService: '{{ include "bluebird.fullname" . }}-canary'

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  gatewaySelector:
    istio: gateway
  hosts:
    - chart-example.local
  port: 80
  httpsRedirect: false
  tls:
    enabled: false
    credentialName: ""
  mesh: true

experiment:
  enabled: false
  host: ""
