nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

replicas: 1

image:
  name: zimmertr/bluebird
  # Empty = chart appVersion. The repo publishes SemVer tags only, no `latest`.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

containerPort: 8000

# The app's Prometheus metrics server (backend/app/telemetry.py). `port`
# drives three faces of one fact — the METRICS_PORT env the app reads, the
# `metrics` containerPort, and the port the PodMonitor scrapes — so they
# cannot drift apart; 0 disables the server and removes the port. The port is
# deliberately never added to the Service: the gateway routes Service ports
# only, so metrics stay unreachable from the public edge regardless of what
# the VirtualService publishes.
metrics:
  port: 9464
  # A monitoring.coreos.com/v1 PodMonitor selecting this chart's pods, for
  # clusters running the prometheus-operator. Off by default because the CRD
  # must exist first. The pods' `role` label (stable|canary, from the
  # Rollout's stableMetadata/canaryMetadata below) is copied onto every
  # series, so a canary's error rate is queryable apart from stable's.
  podMonitor:
    enabled: false

extraEnv:
  - name: LOG_LEVEL
    value: "WARNING"
  - name: RATE_LIMIT_ANALYZE_PER_MINUTE
    value: "12"
  - name: RATE_LIMIT_ANALYZE_BURST
    value: "6"
  - name: RATE_LIMIT_DESTINATIONS_PER_MINUTE
    value: "30"
  - name: RATE_LIMIT_DESTINATIONS_BURST
    value: "10"
  # Sized so one address's first minute (burst + rate) books the Nominatim gate no faster than it serves (bluebird#627).
  - name: RATE_LIMIT_GEOCODE_PER_MINUTE
    value: "10"
  - name: RATE_LIMIT_GEOCODE_BURST
    value: "3"
  - name: UPSTREAM_CONCURRENCY_WEATHER
    value: "4"
  - name: UPSTREAM_CONCURRENCY_AQI
    value: "4"
  - name: UPSTREAM_CONCURRENCY_OVERPASS
    value: "2"
  - name: UPSTREAM_WEIGHT_PER_MINUTE_WEATHER
    value: "550"
  - name: UPSTREAM_WEIGHT_PER_MINUTE_AQI
    value: "550"
  - name: UPSTREAM_WEIGHT_MAX_WAIT_S
    value: "120"
  # Shared across every pod while the database is up, and per pod otherwise,
  # each sized to keep the deployment under Nominatim's 1 a second at ten
  # replicas (bluebird#760).
  - name: NOMINATIM_MIN_INTERVAL_MS
    value: "1200"
  - name: NOMINATIM_POD_MIN_INTERVAL_MS
    value: "10000"
  - name: UPSTREAM_BUDGET_WAIT_S
    value: "30"
  - name: RATE_LIMIT_WILDFIRES_PER_MINUTE
    value: "90"
  - name: RATE_LIMIT_WILDFIRES_BURST
    value: "30"
  - name: WILDFIRE_CACHE_TTL_S
    value: "600"
  - name: WILDFIRE_RETRY_AFTER_FAILURE_S
    value: "60"
  - name: RATE_LIMIT_FIRE_ACTIVITY_PER_MINUTE
    value: "90"
  - name: RATE_LIMIT_FIRE_ACTIVITY_BURST
    value: "30"
  - name: RATE_LIMIT_SMOKE_PER_MINUTE
    value: "90"
  - name: RATE_LIMIT_SMOKE_BURST
    value: "30"
  - name: SMOKE_CACHE_TTL_S
    value: "1800"
  - name: SMOKE_RETRY_AFTER_FAILURE_S
    value: "60"
  - name: RATE_LIMIT_CLOSURES_PER_MINUTE
    value: "90"
  - name: RATE_LIMIT_CLOSURES_BURST
    value: "30"
  - name: CLOSURE_CACHE_TTL_S
    value: "1800"
  - name: CLOSURE_RETRY_AFTER_FAILURE_S
    value: "60"
  - name: RATE_LIMIT_LANDMARKS_PER_MINUTE
    value: "90"
  - name: RATE_LIMIT_LANDMARKS_BURST
    value: "30"
  - name: DATABASE_POOL_MAX
    value: "10"
  # SNODAS_CACHE_TTL_S and SNODAS_RETRY_AFTER_FAILURE_S left with the snow
  # depth grid (bluebird#678). App releases before that one still read them and
  # fall back to their baked-in defaults (3600 and 300) without these entries.
# The shared cache (bluebird#760): one PostgreSQL with PostGIS holding every
# OpenStreetMap peak, lake, trailhead and crag, the wildfire, closure and smoke
# snapshots, and the counters behind the rate limits, so every pod reads the
# same copy instead of asking the upstreams for its own. Everything under this
# key except the three settings below is the CloudNativePG `cluster` chart's
# own values (https://github.com/cloudnative-pg/charts). The operator must
# already run in the cluster.
#
# The app treats the database as optional: with none, or one still starting,
# it searches Overpass and keeps its snapshots and counters per pod, as it did
# before.
database:
  enabled: true
  # For a release that reads another release's database instead of running
  # its own (PR previews): a Secret in this namespace whose `uri` key is the
  # connection string. Read only while `enabled` is false.
  existingSecret: ""
  # Read the cache without writing it: no migrations, no refreshes, and
  # counters kept per pod. For a release on `existingSecret` whose login can
  # only read.
  readOnly: false
  type: postgis
  version:
    postgresql: "18"
    postgis: "3.6"
  cluster:
    # Named outright, because the image the subchart builds from the versions
    # above, `postgis:18-3.6`, is not published: CloudNativePG's maintained
    # PostGIS images carry a flavour and an OS in the tag, and the bare
    # `17-3.5` this ran on until 2026-10 was a frozen legacy build (PostgreSQL
    # 17.5 on Debian bullseye, last rebuilt 2025-07). `standard`, the smaller
    # flavour, carries every extension the subchart's bootstrap creates. The
    # digest pins the build the way the images in bluebird's Dockerfile are
    # pinned, so a rebuild under the same tag arrives by a PR and never at a
    # pod restart; it moves by hand, like the subchart's version in
    # Chart.yaml. A new major is a new cluster, not an upgrade in place: the
    # operator upgrades only between images on one OS, the data is a cache
    # the fill rebuilds, and bluebird decision 0198 has the steps.
    imageName: ghcr.io/cloudnative-pg/postgis:18-3.6-standard-trixie@sha256:6dcf2f3b51411b5f9ba9e59d53ac2d1bc1511ae26086c0d46aa25d955dcd1207
    # Three instances, one per worker where it can: since the browser stopped
    # reading destinations from the map's tiles, every search reads this
    # database, so a node drain or a failed instance hands over to a standby
    # in seconds rather than falling back to Overpass while one pod moves.
    instances: 3
    # Keeps a drain from taking the primary and a standby at once.
    enablePDB: true
    # The app connects as the database's owner and nothing needs more, so no
    # superuser password is created to keep safe.
    enableSuperuserAccess: false
    # Ten replicas at DATABASE_POOL_MAX's ten, plus the PR previews, with room.
    postgresql:
      parameters:
        max_connections: "200"
    storage:
      size: 10Gi

# Builds the database's places table from the OpenStreetMap planet file, once
# per rules version (bluebird#760). A weekly check: most weeks it finds the
# table current and exits in seconds. Weekly because every check creates and
# deletes the scratch volume, and only a release that changes the rules needs a
# refill; start one sooner with `kubectl create job --from=cronjob/<release>-fill`. A fill downloads the planet (about
# 95 GB) to `scratch`, an ephemeral volume deleted with the Job. The first one
# took about 80 minutes to reach the load on a six-core worker, 24 of them the
# download at 62 MiB/s (2026-10-20). Rendered only while `database.enabled` is
# true.
fill:
  enabled: true
  image:
    name: zimmertr/bluebird-fill
    # Empty = chart appVersion: the fill ships with the app, at its version,
    # because both read the same rules.
    tag: ""
    pullPolicy: IfNotPresent
  schedule: "17 9 * * 0"
  # Room for the planet and what the fill writes beside it (about 10% more).
  # Empty storageClass uses the cluster's default.
  scratch:
    size: 120Gi
    storageClass: ""
  # Measured on the first planet fill, 2026-10-20: `osmium getid` peaked at
  # 4,431 MiB while the fill's own process held at most 162 MiB, and
  # `kubectl top` saw the container at 4,489 MiB. The request sits 500 MiB
  # over that, because `getid` sizes its index by OpenStreetMap's highest
  # ids, which only grow, and a fill over its request is the first a node
  # short of memory evicts, an hour into its run. The limit leaves 1 GiB.
  resources:
    requests:
      cpu: 500m
      memory: 5Gi
    limits:
      memory: 6Gi
  # A fill that has not finished in this long has stalled.
  activeDeadlineSeconds: 43200
  extraEnv: []

# Measured against live production on 2026-07-30 with cgroup v2 counters
# (memory.peak and cpu.stat usage_usec, not `kubectl top` -- its decaying ~15s
# average hides exactly the peaks a limit has to cover). Per pod: idle 2m CPU
# / 49Mi; 200 concurrent visitors on the static SPA path (~342 req/s per pod)
# 0.89 cores median, 1.41 peak, 63Mi; discovery load 81Mi peak.
#
# No CPU limit on purpose. CFS throttling on a latency-sensitive async service
# costs tail latency for no benefit when the node has headroom; the request is
# what earns a scheduling guarantee, and the HPA below is what handles load.
#
# The memory REQUEST moved 128Mi -> 256Mi for app 0.44+, which holds a national
# wildfire-perimeter snapshot in memory rather than letting each visitor query
# NIFC for themselves (bluebird#203). Measured 2026-07-31 against the live NIFC
# layer at 232 active fires: 42Mi cold, 184Mi once the snapshot is held, and
# flat across 20 further national viewports. The cost is resident for the
# pod's whole life, not per request, so it belongs in the request rather than
# the headroom under the limit. It is dominated by the full-resolution copy
# (16.5MB of geometry, 861k vertices), kept at full resolution because the
# proximity warning measures distances against it; the map's copy is simplified
# separately. Re-measure if that fidelity choice changes.
#
# App 0.82+ also holds the day's SNODAS snow depth grid (bluebird#449): the
# unmasked 8192 x 4096 int16 grid is exactly 64MiB resident per pod for the
# pod's whole life, plus a transient copy while a refresh decodes the next
# day's file. Fetched once at start and then checked hourly. Same rule as the
# wildfire snapshot: resident cost belongs in the request.
# App releases after bluebird#678 hold no such grid. The request did not move
# with it, because the 512Mi below was set for the wildfire snapshot before the
# grid arrived.
#
# The smoke snapshot added in bluebird#121 does not move this. It is one day's
# NOAA HMS analysis held as prebuilt response text: measured 2026-08-04 at
# 32KB for a quiet day and 447KB of source KML for a busy one, three orders of
# magnitude under the perimeter set, so the request stays where the fire
# overlay put it.
#
# The request moved 256Mi -> 512Mi after the 2026-08 readiness review
# (bluebird#259). The review read the running pods with the same cgroup v2
# counters and found 225-253Mi across three healthy replicas at ~1% load --
# about 98% of the 256Mi request, which made this pod the node's first
# eviction candidate under memory pressure. The growing part is the wildfire
# snapshot above, which scales with the national fire count and therefore
# peaks in fire season rather than in any quiet test. 512Mi is roughly twice
# the measured steady state; the review's own recommendation was 384Mi and the
# maintainer chose the larger step for fire-season headroom. Re-measure at the
# next season peak.
#
# Measured 2026-10-06 (bluebird#624): an analysis holds about 100 MB plus 320
# bytes per destination-hour, and the app refuses one past
# `limits.max_destination_hours` (1,500,000), which peaks near 600 MB. 2Gi
# therefore holds the measured steady state, a full 256 MiB forecast cache and
# two analyses at that budget. Re-measure if the analyze fan-out or the
# Open-Meteo weight budgets change.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# Asserts at the pod level what the image already provides: it runs as uid/gid
# 10001 and writes nothing to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem needs no writable volume: the image sets
# PYTHONDONTWRITEBYTECODE=1 and the app has no tempfile use, no file logging
# and no on-disk cache (both caches are in-process). Verified by running the
# released image under `docker run --read-only` through a full analyze.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# When enabled, spec.replicas is omitted from the workload entirely so a
# GitOps controller cannot fight the HPA over it, and minReplicas becomes the
# floor. CPU is the metric because it is the only one available without a
# custom-metrics adapter -- and it is a real signal here, since static SPA
# serving (production's hot path) is CPU-bound. Memory is deliberately absent:
# in-process caches do not shed on scale-out, so it scales up and never back.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior: {}

# minAvailable, not maxUnavailable: PDB percentages round UP, so at 3 replicas
# `maxUnavailable: 50%` allows 2 disruptions and leaves only 1 pod, while
# `minAvailable: 50%` requires 2 to survive. A percentage rather than an
# integer so the budget tracks HPA-driven replica changes.
podDisruptionBudget:
  enabled: false
  minAvailable: 50%
  maxUnavailable: ""

# Upstream spec.topologySpreadConstraints, except labelSelector, which the
# chart injects to match its own pods. maxSkew 1 over hostname spreads one pod
# per node while nodes last and collapses gracefully when they do not: 3 nodes
# gives [1,1,1], 2 gives [2,1] with nothing Pending, 1 gives [3] because only
# one domain exists. Chosen over podAntiAffinity, whose `preferred` form
# permits needless co-location and whose `required` form leaves pods Pending
# rather than falling back. No matchLabelKeys: Argo Rollouts labels pods
# `rollouts-pod-template-hash`, and per-revision spread is what creates canary
# scheduling deadlocks.
topologySpreadConstraints: []

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  startup:
    enabled: true
    httpGet:
      path: /healthz
      port: 8000
    failureThreshold: 30
    periodSeconds: 5

# Render an Argo Rollout instead of a Deployment. The strategy below must then
# be Canary or BlueGreen.
useRollout: false

# Deployment and Rollout. Unset uses the API default of 600s.
progressDeadlineSeconds:
# Rollout only. Exceeding the deadline otherwise marks it Degraded but never
# rolls back.
progressDeadlineAbort: false

# RollingUpdate | Recreate -> Deployment. Canary | BlueGreen -> Argo Rollout.
# The matching block below (if any) becomes the workload's spec.strategy
# verbatim. An optional `rollingUpdate` map is honored the same way
# (maxSurge/maxUnavailable); unset, the API defaults apply.
strategy: RollingUpdate

# Rollout spec.strategy.canary, verbatim (tpl-rendered so the defaults track
# the release name). Anything env-specific — trafficRouting, analysis,
# experiments — is opt-in; see the README for an Istio example.
canary:
  stableService: '{{ include "bluebird.fullname" . }}'
  canaryService: '{{ include "bluebird.fullname" . }}-canary'
  stableMetadata:
    labels:
      role: stable
  canaryMetadata:
    labels:
      role: canary
  steps:
    - setWeight: 33
    - setWeight: 66
    - setWeight: 100

# Rollout spec.strategy.blueGreen, verbatim (tpl-rendered).
blueGreen:
  activeService: '{{ include "bluebird.fullname" . }}'
  previewService: '{{ include "bluebird.fullname" . }}-canary'

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  gatewaySelector:
    istio: gateway
  hosts:
    - chart-example.local
  port: 80
  httpsRedirect: false
  tls:
    enabled: false
    credentialName: ""
  mesh: true
  # Least privilege at the publication boundary (bluebird#240): the gateway
  # routes exactly these /api prefixes -- the surface the web app itself
  # calls, plus /api/version for checking which build answers. Every other
  # path under /api/, its slash literal or encoded as %2F (bluebird#620),
  # answers the app's own JSON-404 shape at the edge (its `error`
  # object and its security headers included, copied from the app's
  # backend/edge_not_found.json and compared with it by the non-blocking
  # Edge 404 workflow), so an
  # endpoint added to the app later is internal until this list says
  # otherwise, and publishing one is a deliberate edit here. The analyze
  # routes are not on this list; they are published by keyedApiPrefixes
  # below, which asks for a header first. Non-API paths (the SPA, /docs,
  # /privacy, /terms) are not filtered. In-cluster callers -- the Argo
  # Rollouts api-test probe, port-forward development, the mesh -- never pass
  # the gateway and see everything.
  publicApiPrefixes:
    - /api/destinations
    - /api/capabilities
    - /api/version
    - /api/geocode
    - /api/wildfires
    - /api/fire-activity
    - /api/smoke
    - /api/closures
    - /api/config
    - /api/landmarks
  # Published only to a request carrying an Open-Meteo API key in the
  # X-Open-Meteo-Key header (bluebird#317). One analyze request can spend
  # thousands of weighted Open-Meteo calls; the app sends a keyed one to
  # Open-Meteo's customer hosts, so it spends the caller's quota rather than
  # the pod's shared free tier. That is what the header buys, and it is why
  # these prefixes are a separate list: without the header the request falls
  # through to the same JSON-404 every unpublished /api path gets, before the
  # pod is asked to spend anything. A browser's CORS preflight for these
  # prefixes (OPTIONS with Origin and Access-Control-Request-Method) is
  # forwarded without the header, because a preflight cannot carry it; the
  # pod's CORS middleware answers it without reaching a route. The gateway checks only that the header is
  # non-empty; whether the key works is Open-Meteo's answer, returned as a
  # 401. Set to an empty list to take the analyze routes off the public
  # gateway entirely, which is the off switch for the feature -- the app has
  # no reason to refuse a key, so there is no env knob for it.
  keyedApiPrefixes:
    - /api/analyze
  # Publish the whole /api surface instead, allowlist off. Preview
  # environments set true: their hosts resolve only on the LAN, and the PR
  # containers are where the analyze API is exercised.
  publishFullApi: false
  # Off when empty, which is the right setting without a Cloudflare Tunnel.
  # The app keys its rate limits on CF-Connecting-IP when a request carries
  # it, because Cloudflare overwrites the header and the tunnel is the only
  # path from the internet. A gateway that is also reachable on another path
  # (the LAN address a tunnel shares) lets a caller there set the header to
  # any address (bluebird#631). Set this to an RE2 pattern that matches the
  # address the gateway sees a tunnel request arrive from, and the gateway
  # removes CF-Connecting-IP from every request whose peer does not match it.
  # It is matched against the last X-Forwarded-For hop, which the gateway
  # writes itself, so it must match one address and nothing longer: no
  # unbounded `.*`, which would also match a client-typed hop before it.
  tunnel:
    peerRegex: ""

experiment:
  enabled: false
  host: ""
