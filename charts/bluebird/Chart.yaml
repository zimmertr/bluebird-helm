apiVersion: v2
name: bluebird-helm
description: A map-based weather window finder for hikers and mountaineers. Deploys as a plain Deployment by default; Argo Rollouts and Istio are opt-in.
type: application
# version is overwritten at package time by CI (GitVersion). Kept here for local `helm template`.
version: 0.1.0
# appVersion tracks the default bluebird container image tag when none is supplied.
# Must be a published zimmertr/bluebird tag — Artifact Hub scans the rendered image.
appVersion: "0.96.2"
home: https://bluebirdforecast.com
# From the app repository rather than the site: Artifact Hub's indexer fetches
# the logo once per chart version from its own egress, and every fetch of the
# site's copy has timed out awaiting headers (the catalog has never shown a
# logo), while the same bytes answer from GitHub at once.
icon: https://raw.githubusercontent.com/zimmertr/bluebird/main/frontend/public/icon.png
sources:
  - https://github.com/zimmertr/bluebird
  - https://github.com/zimmertr/bluebird-helm
keywords:
  - weather
  - hiking
  - mountaineering
  - argo-rollouts
  - istio
maintainers:
  - name: TJ Zimmerman
annotations:
  artifacthub.io/license: GPL-3.0-only
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Bluebird application source
      url: https://github.com/zimmertr/bluebird
    - name: Live site
      url: https://bluebirdforecast.com
