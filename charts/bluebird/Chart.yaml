apiVersion: v2
name: bluebird-helm
description: A map-based weather window finder for hikers and mountaineers. Deploys as a plain Deployment by default; Argo Rollouts and Istio are opt-in.
type: application
# version is overwritten at package time by CI (GitVersion). Kept here for local `helm template`.
version: 0.1.0
# appVersion tracks the default bluebird container image tag when none is supplied.
# Must be a published ghcr.io/zimmertr/bluebird tag, or a default install can't pull it.
appVersion: "0.134.9"
# The shared cache (bluebird#760): PostgreSQL with PostGIS, run by the
# CloudNativePG operator from its own upstream chart rather than a database
# this chart would have to maintain. Off with `database.enabled: false`. The
# operator is not a dependency: it installs cluster-wide CRDs and webhooks, so
# it is installed once per cluster, beside this chart.
dependencies:
  - name: cluster
    alias: database
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    condition: database.enabled
home: https://bluebirdforecast.com
icon: https://raw.githubusercontent.com/zimmertr/bluebird/main/frontend/public/icon.png
sources:
  - https://github.com/zimmertr/bluebird
  - https://github.com/zimmertr/bluebird-helm
keywords:
  - weather
  - hiking
  - mountaineering
  - argo-rollouts
  - istio
  - postgis
maintainers:
  - name: TJ Zimmerman
