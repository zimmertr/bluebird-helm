{{- if .Values.ingress.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "bluebird.fullname" . }}
  namespace: {{ include "bluebird.namespace" . }}
  labels:
    {{- include "bluebird.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hosts:
    {{- toYaml .Values.ingress.hosts | nindent 4 }}
    {{- if .Values.ingress.mesh }}
    - {{ include "bluebird.fullname" . }}.{{ include "bluebird.namespace" . }}.svc.cluster.local
    {{- end }}
  gateways:
    {{- if .Values.ingress.mesh }}
    - mesh
    {{- end }}
    - {{ include "bluebird.fullname" . }}
  http:
    {{- if not .Values.ingress.publishFullApi }}
    # Least privilege at the publication boundary (bluebird#240): the gateway
    # forwards only the /api prefixes named in ingress.publicApiPrefixes, and
    # every other path under /api/ answers the app's own JSON-404 shape at the
    # edge, whether its slash after "api" is literal or encoded as %2F (the
    # -api-internal route below says why the encoded form needs its own match).
    # Both rules name the public gateway, so mesh-routed and Service-direct
    # traffic (the Rollouts api-test probe, development) always sees the full
    # surface. Non-API paths — the SPA, /docs, /privacy — ride the stable
    # route below, untouched. This pair sits ahead of the experiment route so
    # a header cannot reach what the gateway does not publish; the cost is
    # that an experiment steers only non-API traffic.
    - name: {{ include "bluebird.fullname" . }}-api-public
      match:
        {{- range .Values.ingress.publicApiPrefixes }}
        - uri:
            prefix: {{ . | quote }}
          gateways:
            - {{ include "bluebird.fullname" $ }}
        {{- end }}
      # The same destination pair as the stable route, so naming this route in
      # canary trafficRouting keeps API traffic canary-weighted too.
      route:
        - destination:
            host: {{ include "bluebird.fullname" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 100
        {{- if eq .Values.strategy "Canary" }}
        - destination:
            host: {{ include "bluebird.secondaryServiceName" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 0
        {{- end }}
    # The analyze routes, published only to a request that carries a caller's
    # own Open-Meteo key (bluebird#317). One analyze request can spend
    # thousands of weighted Open-Meteo calls; a keyed one spends the caller's
    # quota instead of the pod's, which is what makes the route affordable to
    # publish at all. The match tests only that the header is non-empty --
    # whether the key works is Open-Meteo's answer, which the app returns as a
    # 401. Without the header the request falls through to the 404 route
    # below, so the pod is never asked to spend anything.
    #
    # The header name is hardcoded here because Istio matches a literal, and
    # the backend is where it is defined: API_KEY_HEADER in
    # app/routes/analyze/route.py, published by GET /api/capabilities as
    # api_key_header. Istio lowercases HTTP/2 header names, so the match is
    # written lowercase. Renaming it there means editing it here.
    #
    # A browser on another origin cannot send the key on its CORS preflight:
    # the OPTIONS it sends first names the headers the real request will carry
    # in Access-Control-Request-Headers and carries none of them. So each
    # prefix has a second match for a preflight alone -- OPTIONS with an
    # Origin and an Access-Control-Request-Method -- which the pod's
    # CORSMiddleware answers itself, before any route or upstream is reached.
    # A keyless POST still matches neither and gets the 404 below
    # (bluebird#565).
    #
    # This route sits between -api-public and -api-internal: after the public
    # allowlist, before the 404, so the 404 stays the last /api rule.
    {{- if .Values.ingress.keyedApiPrefixes }}
    - name: {{ include "bluebird.fullname" . }}-api-keyed
      match:
        {{- range .Values.ingress.keyedApiPrefixes }}
        - uri:
            prefix: {{ . | quote }}
          headers:
            x-open-meteo-key:
              regex: ".+"
          gateways:
            - {{ include "bluebird.fullname" $ }}
        - uri:
            prefix: {{ . | quote }}
          method:
            exact: OPTIONS
          headers:
            origin:
              regex: ".+"
            access-control-request-method:
              regex: ".+"
          gateways:
            - {{ include "bluebird.fullname" $ }}
        {{- end }}
      # The same destination pair as -api-public, so naming this route in
      # canary trafficRouting keeps keyed traffic canary-weighted too. Left
      # off that list it stays 100/0 stable through every rollout.
      route:
        - destination:
            host: {{ include "bluebird.fullname" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 100
        {{- if eq .Values.strategy "Canary" }}
        - destination:
            host: {{ include "bluebird.secondaryServiceName" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 0
        {{- end }}
    {{- end }}
    # This answer never reaches the pod, so it is a copy of the pod's own 404
    # and must say what the pod would: the app's catch-all body with "this
    # path" for the path (a fixed answer cannot repeat the request), the
    # `error` object API callers branch on, and the headers the pod sends on
    # every response (bluebird#132). The source is backend/edge_not_found.json
    # in the app repo, written from the app itself; the Edge 404 workflow
    # (.github/workflows/edge-404.yml) turns red when this route differs from
    # that file on bluebird's main, so copy a change from there rather than
    # editing here (bluebird#565).
    #
    # Every match here, and in the two routes above, compares the path as
    # literal text, and Istio's default path normalization does not decode
    # %2F; the pod does, before it routes. So /api%2Fanalyze matched none of
    # them, fell through to the stable route, and ran the analyze route
    # without a key (bluebird#620). The regex match refuses that shape in
    # either case of the hex digit; it must match the whole path, query string
    # excluded, hence the trailing .*. It covers the shape that dodges every
    # /api rule at once; an encoded slash later in a path still meets those
    # rules, and the pod refuses an encoded slash anywhere (#302).
    - name: {{ include "bluebird.fullname" . }}-api-internal
      match:
        - uri:
            prefix: /api/
          gateways:
            - {{ include "bluebird.fullname" . }}
        - uri:
            exact: /api
          gateways:
            - {{ include "bluebird.fullname" . }}
        - uri:
            regex: "(?i)/api%2f.*"
          gateways:
            - {{ include "bluebird.fullname" . }}
      directResponse:
        status: 404
        body:
          string: '{"detail":"No API endpoint at this path. See /docs for the full API reference, or /openapi.json for the machine-readable schema.","error":{"code":"not_found","retryable":false}}'
      headers:
        response:
          set:
            access-control-allow-origin: "*"
            access-control-expose-headers: Retry-After
            cache-control: no-cache
            content-security-policy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://mesonet.agron.iastate.edu https://mapservices.weather.noaa.gov; connect-src 'self' data: https://api.open-meteo.com https://air-quality-api.open-meteo.com https://archive-api.open-meteo.com https://tiles.openfreemap.org https://mesonet.agron.iastate.edu https://mapservices.weather.noaa.gov; worker-src 'self' blob:; child-src 'self' blob:"
            content-type: application/json
            permissions-policy: geolocation=(self), camera=(), microphone=(), payment=()
            referrer-policy: strict-origin-when-cross-origin
            vary: Origin
            x-content-type-options: nosniff
    {{- end }}
    {{- if .Values.experiment.enabled }}
    - name: {{ include "bluebird.fullname" . }}-experiment
      match:
        - headers:
            experiment:
              exact: "true"
      route:
        - destination:
            host: {{ default (printf "%s-canary" (include "bluebird.fullname" .)) .Values.experiment.host }}
            port:
              number: {{ .Values.service.port }}
    {{- end }}
    - name: {{ include "bluebird.fullname" . }}-stable
      route:
        - destination:
            host: {{ include "bluebird.fullname" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 100
        {{- if eq .Values.strategy "Canary" }}
        - destination:
            host: {{ include "bluebird.secondaryServiceName" . }}
            port:
              number: {{ .Values.service.port }}
          weight: 0
        {{- end }}
{{- end }}
