{{- if .Values.podDisruptionBudget.enabled }}
{{- /* The selector matches on selectorLabels alone, so during a canary this
       one budget covers stable and canary pods together. Per-ReplicaSet
       budgets are not implemented upstream (argo-rollouts#2419). */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bluebird.fullname" . }}
  namespace: {{ include "bluebird.namespace" . }}
  labels:
    {{- include "bluebird.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bluebird.selectorLabels" . | nindent 6 }}
{{- end }}
