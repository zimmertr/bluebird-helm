version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment
  # (zimmertr/bluebird#632). Dependabot reads that comment, proposes the next
  # release, and rewrites the SHA and the comment together, so a pin moves
  # only by PR. Actions only: the chart's other update sources are
  # bluebird-helm#301's to decide.
  #
  # Each release waits three days before it is proposed, because a patch or
  # minor merges itself (dependabot-auto-merge.yml). yggdrasil's modules are
  # pinned here too, and every yggdrasil release bakes three days before its
  # consumers take it (yggdrasil's record 0023). Security updates don't wait.
  # Daily, so a release arrives three days after it ships rather than up to
  # ten. zizmor's pedantic audit asks for seven; record 0023 sets three.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown]
