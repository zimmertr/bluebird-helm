name: PR Title

# The PR title becomes the squash commit's title, and that line alone decides
# the release bump. yggdrasil's pr-title module refuses a title that isn't
# `type(scope): summary` with one of the types the release module's GitVersion
# patterns read, before the merge rather than after the release.
#
# A workflow of its own rather than a job in pr.yml, because it has to run when
# only the title changes (`edited`), and an edit must not rerun pr.yml.
# `synchronize` stays in the list because a check reports against the head
# commit, so a push with no run of its own would carry no result.
#
# Branch protection requires `PR Title / PR Title` (this job's name, then the
# module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  title:
    name: PR Title
    uses: zimmertr/yggdrasil/.github/workflows/pr-title.yml@fd0ee632ebad3cb4623bd64ca77838e6aa7a2dce # v1.2.4
    permissions:
      pull-requests: read # the module reads the PR's title
