name: Release Chart

# A chart release, every step of it a job of yggdrasil's release module: it
# reads the version from the squash commit's title (GitVersion, the module's
# default patterns), makes the git tag and GitHub release, pushes the chart
# under that version, and only then points Kubernetes-Manifests at it.
# Decision record 0005.
on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/release.yml'
  # Manual runs from main only: the module releases only on main, so a
  # dispatch from another branch publishes nothing.
  workflow_dispatch:

# Serialize chart releases, so two quick merges can't race for one version or
# on the bump branches. cancel-in-progress stays false so every chart release
# still lands, in order.
concurrency:
  group: chart-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    uses: zimmertr/yggdrasil/.github/workflows/release.yml@f805e7b874e54e661d8dc8ad528883228bfc567b # v1.2.9
    permissions:
      contents: write # the tag and release
      packages: write # the chart, pushed to oci://ghcr.io/zimmertr
    with:
      # No image, so the chart keeps the appVersion in its Chart.yaml: its
      # default image tag, which Bluebird's release sets by PR, so it always
      # names a published ghcr.io/zimmertr/bluebird tag. The module fetches
      # the database subchart (bluebird#760) as it packages: it is not
      # committed, and charts/bluebird/charts/ and Chart.lock are ignored.
      charts: '[{"chart": "charts/bluebird"}]'
      # Kubernetes-Manifests' two consumers of the chart, the preview
      # ApplicationSet and the stable app, each through a self-merging PR,
      # because Kubernetes-Manifests forbids direct commits to main. Its
      # `Validate manifests` check renders the change, so a chart version that
      # doesn't resolve fails the PR instead of an Argo CD sync. Separate
      # branches, so a preview bump never waits behind a stable one.
      deploys: >-
        [{"repo": "zimmertr/Kubernetes-Manifests",
          "file": "public/bluebird-pr/applicationset.yml",
          "set": ".spec.template.spec.source.targetRevision",
          "branch": "chore/bluebird-preview-chart",
          "title": "chore: bump bluebird preview chart"},
         {"repo": "zimmertr/Kubernetes-Manifests",
          "file": "public/bluebird/kustomization.yml",
          "set": "(.helmCharts[] | select(.name == \"bluebird-helm\")).version",
          "branch": "chore/bluebird-stable-chart",
          "title": "chore: bump bluebird stable chart"}]
    secrets:
      # Contents and pull-requests write on Kubernetes-Manifests.
      deploy-token: ${{ secrets.GH_PAT }}
