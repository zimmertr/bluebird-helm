name: Chart PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chart-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-render:
    name: Lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/bluebird
      - name: Render stable scenario (Canary + Istio)
        run: |
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            --set ingress.tls.enabled=true --set ingress.tls.credentialName=bluebird \
            --set ingress.httpsRedirect=true >/dev/null
      - name: Render preview scenario (Deployment + Istio)
        run: |
          helm template bluebird-pr-1 charts/bluebird -n bluebird-system \
            --set image.name=zimmertr/bluebird-pr \
            --set image.tag=pr-1-deadbeef --set replicas=1 \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0]=pr-1.ganymede.sol.milkyway' >/dev/null
      - name: Render portable scenario (plain Deployment, no add-ons)
        run: helm template bluebird charts/bluebird >/dev/null

      # The scenarios above prove the chart renders. This proves it *refuses*,
      # which is the half consuming repos depend on: helm ignores a value the
      # chart does not read, so without values.schema.json a consumer pinning a
      # renamed key keeps rendering green while silently losing the setting.
      # Asserting the failure here means a schema that stops matching the
      # templates (additionalProperties dropped, root loosened) fails the PR
      # rather than quietly ceasing to guard anything.
      - name: Reject a value the chart does not read
        run: |
          if helm template bluebird charts/bluebird \
               --set thisKeyIsNotInTheSchema=1 >/dev/null 2>err.txt; then
            echo "::error::values.schema.json accepted an unknown key; the chart no longer guards its values contract."
            exit 1
          fi
          # Matched loosely on purpose: helm 3 says "Additional property X is
          # not allowed" and helm 4 says "additional properties 'X' not
          # allowed", and setup-helm above is unpinned. The key name plus
          # "not allowed" is the part both phrasings agree on.
          grep -qi "thisKeyIsNotInTheSchema.*not allowed" err.txt || {
            echo "::error::render failed, but not on the schema. Actual error:"; cat err.txt; exit 1; }
          echo "Rejected as expected."

  publish-prerelease:
    name: Publish prerelease chart
    runs-on: ubuntu-latest
    # Only same-repo PRs (fork PRs have no secrets and read-only tokens).
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - uses: azure/setup-helm@v4
      - name: Package & push prerelease
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          SHORT="$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)"
          VER="${{ steps.gitversion.outputs.majorMinorPatch }}-pr${{ github.event.pull_request.number }}.g${SHORT}"
          echo "Publishing prerelease chart $VER"
          # PR charts share the release OCI repo, and semver ranks e.g.
          # 0.4.3-pr9 above the released 0.4.2 — without this flip Artifact
          # Hub shows a PR build as the package's latest version.
          sed -i 's|artifacthub.io/prerelease: "false"|artifacthub.io/prerelease: "true"|' charts/bluebird/Chart.yaml
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          helm package charts/bluebird --version "$VER"
          helm push "bluebird-helm-${VER}.tgz" oci://registry-1.docker.io/zimmertr
