name: Chart PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chart-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-render:
    name: Lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          # Exact: with no version the action installs whatever Helm is
          # newest on the day. Dependabot does not read this input.
          version: v4.3.0
      - name: helm lint
        run: helm lint charts/bluebird
      - name: Render stable scenario (Canary + Istio)
        run: |
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            --set ingress.tls.enabled=true --set ingress.tls.credentialName=bluebird \
            --set ingress.httpsRedirect=true >/dev/null
      # Which route each request shape lands on, through the public gateway:
      # the encoded slash (bluebird#620) and the shapes beside it.
      - name: Edge route cases (stable scenario)
        run: |
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            | yq -o=json 'select(.kind == "VirtualService")' \
            | python3 .github/scripts/check_edge_routes.py
      - name: Render preview scenario (Deployment + Istio)
        run: |
          helm template bluebird-pr-1 charts/bluebird -n bluebird-system \
            --set image.name=zimmertr/bluebird-pr \
            --set image.tag=pr-1-deadbeef --set replicas=1 \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0]=pr-1.ganymede.sol.milkyway' >/dev/null
      - name: Render portable scenario (plain Deployment, no add-ons)
        run: helm template bluebird charts/bluebird >/dev/null

  publish-prerelease:
    name: Publish prerelease chart
    runs-on: ubuntu-latest
    # Only same-repo PRs (fork PRs have no secrets and read-only tokens), and
    # not Dependabot's: its pull_request runs read Dependabot's own, empty
    # secret store, so the Docker Hub login below has no credentials and the
    # push fails with a 401. Nothing is lost by skipping it: dependabot.yml
    # bumps actions only, never charts/**, so there is no chart to preview.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gittools/actions/gitversion/setup@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1
        with:
          # Exact, not '6.x': the version this computes names the chart,
          # its tag and the bump branches. Dependabot does not read this.
          versionSpec: '6.8.2'
      - id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          # Exact: with no version the action installs whatever Helm is
          # newest on the day. Dependabot does not read this input.
          version: v4.3.0
      - name: Package & push prerelease
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAJOR_MINOR_PATCH: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          SHORT="${HEAD_SHA:0:7}"
          VER="${MAJOR_MINOR_PATCH}-pr${PR_NUMBER}.g${SHORT}"
          echo "Publishing prerelease chart $VER"
          # PR charts share the release OCI repo, and semver ranks e.g.
          # 0.4.3-pr9 above the released 0.4.2. This flag only labels the
          # version as a prerelease on Artifact Hub; it does NOT stop Artifact
          # Hub from listing the PR build as the package's default version.
          # The `ignore` entry in artifacthub-repo.yml is what keeps PR builds
          # off the listing. Helm itself skips prereleases without the flag.
          sed -i 's|artifacthub.io/prerelease: "false"|artifacthub.io/prerelease: "true"|' charts/bluebird/Chart.yaml
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          helm package charts/bluebird --version "$VER"
          helm push "bluebird-helm-${VER}.tgz" oci://registry-1.docker.io/zimmertr
