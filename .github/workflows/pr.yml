name: Chart PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chart-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-render:
    name: Lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/bluebird
      - name: Render stable scenario (Canary + Istio)
        run: |
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            --set ingress.tls.enabled=true --set ingress.tls.credentialName=bluebird \
            --set ingress.httpsRedirect=true >/dev/null
      - name: Render preview scenario (Deployment + Istio)
        run: |
          helm template bluebird-pr-1 charts/bluebird -n bluebird-system \
            --set image.name=zimmertr/bluebird-pr \
            --set image.tag=pr-1-deadbeef --set replicas=1 \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0]=pr-1.ganymede.sol.milkyway' >/dev/null
      - name: Render portable scenario (plain Deployment, no add-ons)
        run: helm template bluebird charts/bluebird >/dev/null
      # The gateway's 404 never reaches the pod, so it is a copy of the pod's
      # own, and a copy kept in another repository drifts without a sound: the
      # body went a release without the app's `error` object (bluebird#565).
      # The app writes down what the copy must say, from the app itself, in
      # backend/edge_not_found.json; this renders the route and compares its
      # status, parsed body and response headers with that file. Read from
      # bluebird's main rather than the release appVersion names, so a chart
      # PR that copies a change passes without waiting on the appVersion bump,
      # and the bump cannot pass without the copy.
      - name: Edge 404 matches the app
        env:
          EDGE_RECORD: https://raw.githubusercontent.com/zimmertr/bluebird/main/backend/edge_not_found.json
        run: |
          if ! curl -fsSL --retry 3 "$EDGE_RECORD" > want-raw.json; then
            echo "::error::Could not read $EDGE_RECORD, the app's record of what this route must send."
            exit 1
          fi
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            | yq -o=json 'select(.kind == "VirtualService") | .spec.http[] | select(.name == "bluebird-api-internal")' \
            > route.json
          test -s route.json
          jq -S '{status: .directResponse.status, body: (.directResponse.body.string | fromjson), headers: .headers.response.set}' route.json > got.json
          jq -S '{status, body, headers}' want-raw.json > want.json
          if ! diff -u want.json got.json; then
            echo "::error file=charts/bluebird/templates/virtualservice.yaml::The -api-internal route differs from bluebird's backend/edge_not_found.json (diff above: - is the app, + is the chart). Copy the app's body and headers into the route."
            exit 1
          fi

  publish-prerelease:
    name: Publish prerelease chart
    runs-on: ubuntu-latest
    # Only same-repo PRs (fork PRs have no secrets and read-only tokens).
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - uses: azure/setup-helm@v4
      - name: Package & push prerelease
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          SHORT="$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)"
          VER="${{ steps.gitversion.outputs.majorMinorPatch }}-pr${{ github.event.pull_request.number }}.g${SHORT}"
          echo "Publishing prerelease chart $VER"
          # PR charts share the release OCI repo, and semver ranks e.g.
          # 0.4.3-pr9 above the released 0.4.2. This flag only labels the
          # version as a prerelease on Artifact Hub; it does NOT stop Artifact
          # Hub from listing the PR build as the package's default version.
          # The `ignore` entry in artifacthub-repo.yml is what keeps PR builds
          # off the listing. Helm itself skips prereleases without the flag.
          sed -i 's|artifacthub.io/prerelease: "false"|artifacthub.io/prerelease: "true"|' charts/bluebird/Chart.yaml
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          helm package charts/bluebird --version "$VER"
          helm push "bluebird-helm-${VER}.tgz" oci://registry-1.docker.io/zimmertr
