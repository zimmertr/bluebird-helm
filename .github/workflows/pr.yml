name: Chart PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chart-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-render:
    name: Lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Exact: with no version the action installs whatever Helm is
          # newest on the day. Dependabot does not read this input.
          version: v4.3.0
      # The database subchart (bluebird#760) is fetched at build time rather
      # than committed: charts/bluebird/charts/ and Chart.lock are ignored.
      - name: Fetch the chart's dependencies
        run: |
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm dependency build charts/bluebird
      - name: helm lint
        run: helm lint charts/bluebird
      - name: Render stable scenario (Canary + Istio)
        run: |
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            --set ingress.tls.enabled=true --set ingress.tls.credentialName=bluebird \
            --set ingress.httpsRedirect=true >/dev/null
      # Which route each request shape lands on, through the public gateway:
      # the encoded slash (bluebird#620) and the shapes beside it.
      - name: Edge route cases (stable scenario)
        run: |
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            | yq -o=json 'select(.kind == "VirtualService")' \
            | python3 .github/scripts/check_edge_routes.py
      # The same shapes with the tunnel strip on (bluebird#631): from the
      # tunnel's peer each keeps CF-Connecting-IP on its usual route, and from
      # any LAN peer it lands on that route's -off-tunnel twin, which removes
      # the header. The step above is the other half: off, nothing removes it.
      - name: Edge route cases (tunnel strip on)
        run: |
          helm template bluebird charts/bluebird -n bluebird-system \
            --set strategy=Canary --set ingress.enabled=true \
            --set 'ingress.hosts[0]=bluebirdforecast.com' \
            -f .github/scripts/tunnel_values.yaml \
            | yq -o=json 'select(.kind == "VirtualService")' \
            | python3 .github/scripts/check_edge_routes.py --tunnel
      - name: Render preview scenario (Deployment + Istio)
        run: |
          helm template bluebird-pr-1 charts/bluebird -n bluebird-system \
            --set image.name=zimmertr/bluebird-pr \
            --set image.tag=pr-1-deadbeef --set replicas=1 \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0]=pr-1.ganymede.sol.milkyway' >/dev/null
      - name: Render portable scenario (plain Deployment, no add-ons)
        run: helm template bluebird charts/bluebird >/dev/null
