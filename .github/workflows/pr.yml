name: Chart PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chart-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # yggdrasil's chart module: the database subchart fetched, `helm lint`, a
  # render with the defaults (the portable scenario: a plain Deployment, no
  # add-ons), on the Helm version the release packages with, then the
  # helm-unittest suites in charts/bluebird/tests/: the stable and preview
  # scenarios, and the edge routes pinned with and without the tunnel. The
  # required check is `Chart / Chart`. Decision records 0005 and 0006.
  chart:
    name: Chart
    uses: zimmertr/yggdrasil/.github/workflows/chart.yml@f5661bbe5864dfae07e6dbd603489e2326980b3d # v2.0.0
    permissions:
      contents: read
    with:
      chart: charts/bluebird
