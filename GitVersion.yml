workflow: GitHubFlow/v1
strategies:
  - Mainline
tag-prefix: 'v'
branches:
  main:
    mode: ContinuousDeployment
# The squash commit's title is the PR title, so these three read the title and
# nothing else. Without `(?m)`, `^` is the start of the whole message, which is
# what keeps a body line out: a `BREAKING CHANGE:` footer, or a line that starts
# `fix!:`, must not cut a major (zimmertr/bluebird decision 0080). GitVersion
# matches without regard to case, so `Fix!:` is a major too.
#
# The scope is `[^)\r\n]+` rather than `.+` because `.+` runs past the scope's
# own `)`, which reads `fix(ui): explain feat(api)!: titles` as a major.
# The prefixes match zimmertr/bluebird's GitVersion.yml, so one title means
# one bump in both repos. A title no pattern matches still releases a patch
# through the branch's default increment, but the title check refuses it.
#
# That check, .github/scripts/check_pr_title.py, reads these three lines and
# fails a PR whose title none of them matches. Keep each pattern on one line.
major-version-bump-message: '^(feat|fix|perf|refactor|chore|docs|style|test|ci|build)(\([^)\r\n]+\))?!:'
minor-version-bump-message: '^feat(\([^)\r\n]+\))?:'
patch-version-bump-message: '^(fix|perf|refactor|chore|docs|style|test|ci|build)(\([^)\r\n]+\))?:'
